<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Larkspur Agent Factory</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c232c; --line: #2a323d;
    --ink: #e7edf3; --ink-dim: #9aa7b4; --ink-faint: #66727f;
    --accent: #4c9be8; --accent-dim: #2b4a68;
    --read: #3fb6a8; --write: #d8a13a; --destructive: #e07a3e; --critical: #e0556b;
    --good: #46b17b; --run: #4c9be8;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  code, .mono { font-family: var(--mono); }

  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 14px max(16px, env(safe-area-inset-left)) 14px max(16px, env(safe-area-inset-left));
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; font-weight: 600; }
  header h1 .dim { color: var(--ink-faint); font-weight: 400; }
  .health { margin-left: auto; display: flex; gap: 14px; font-size: 12px; color: var(--ink-dim); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; background: var(--ink-faint); }
  .dot.ok { background: var(--good); } .dot.bad { background: var(--critical); }

  .wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 0; height: calc(100% - 52px); }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; height: auto; } }

  .rail { border-right: 1px solid var(--line); overflow-y: auto; background: var(--bg); }
  .rail-head { padding: 12px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); }
  .agent-card {
    padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
    border-left: 2px solid transparent;
  }
  .agent-card:hover { background: var(--panel); }
  .agent-card.sel { background: var(--panel); border-left-color: var(--accent); }
  .agent-card .name { font-weight: 600; font-size: 13.5px; }
  .agent-card .desc { color: var(--ink-dim); font-size: 12px; margin-top: 3px; }
  .agent-card .perms { margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
  .pchip { font-family: var(--mono); font-size: 10.5px; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-faint); }
  .pchip.r { color: var(--read); border-color: color-mix(in srgb, var(--read) 40%, transparent); }
  .pchip.rw { color: var(--write); border-color: color-mix(in srgb, var(--write) 45%, transparent); background: color-mix(in srgb, var(--write) 10%, transparent); }

  main { overflow-y: auto; padding: 20px max(20px, env(safe-area-inset-right)) 60px 20px; }
  .empty { color: var(--ink-faint); padding: 40px 8px; max-width: 60ch; }

  .detail-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .detail-head h2 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .tags { display: flex; gap: 6px; }
  .tag { font-size: 11px; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
  .subtle { color: var(--ink-dim); margin: 2px 0 20px; max-width: 70ch; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; align-items: start; }
  .block { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .block > h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); padding: 11px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .block .body { padding: 14px; }
  .block .body.tight { padding: 0; }

  .permrow { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .permrow:last-child { border-bottom: none; }
  .permrow .mod { font-family: var(--mono); }
  .permval { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 4px; }
  .permval.none { color: var(--ink-faint); }
  .permval.r { color: var(--read); background: color-mix(in srgb, var(--read) 12%, transparent); }
  .permval.rw { color: var(--write); background: color-mix(in srgb, var(--write) 14%, transparent); }

  .prompt { font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--ink-dim); white-space: pre-wrap; margin: 0; max-height: 240px; overflow-y: auto; }
  .query { font-size: 14px; line-height: 1.6; white-space: pre-wrap; margin: 0; color: var(--ink); }

  .tiergroup { border-bottom: 1px solid var(--line); }
  .tiergroup:last-child { border-bottom: none; }
  .tierhead { display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .tierhead .stripe { width: 3px; height: 13px; border-radius: 2px; }
  .tierhead .count { margin-left: auto; color: var(--ink-faint); font-family: var(--mono); }
  .t-read { color: var(--read); } .t-read .stripe { background: var(--read); }
  .t-write { color: var(--write); } .t-write .stripe { background: var(--write); }
  .t-destructive { color: var(--destructive); } .t-destructive .stripe { background: var(--destructive); }
  .t-critical { color: var(--critical); } .t-critical .stripe { background: var(--critical); }
  .tool { display: flex; gap: 10px; padding: 4px 14px 4px 27px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
  .tool .m { color: var(--ink-faint); width: 46px; flex: none; }
  .tool .p { color: var(--ink-faint); }
  .tool:last-child { padding-bottom: 10px; }

  .actions { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; align-items: center; }
  button { font-family: var(--sans); font-size: 13px; font-weight: 550; border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); }
  button:hover { border-color: var(--ink-faint); }
  button.primary { background: var(--critical); border-color: var(--critical); color: #fff; }
  button.primary:hover { background: color-mix(in srgb, var(--critical) 85%, black); }
  button.ghost { background: transparent; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .warn { font-size: 12px; color: var(--ink-dim); }
  select { font-family: var(--mono); font-size: 12px; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; }

  .runs { margin-top: 8px; }
  .runrow { display: grid; grid-template-columns: 12px 1fr auto auto auto auto; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 12px; cursor: pointer; }
  .runrow .dur { font-family: var(--mono); color: var(--ink-dim); font-variant-numeric: tabular-nums; text-align: right; }
  .runrow:hover { background: var(--panel); }
  .runrow .rid { font-family: var(--mono); color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .runrow .meta { font-family: var(--mono); color: var(--ink-faint); }
  .status { font-size: 11px; font-family: var(--mono); }
  .status.running { color: var(--run); } .status.done { color: var(--good); } .status.error { color: var(--critical); }
  .spin { display:inline-block; width:8px;height:8px;border-radius:50%; background: var(--run); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

  dialog { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 12px; padding: 0; max-width: 900px; width: 92vw; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .modal-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .modal-head h3 { margin: 0; font-size: 14px; font-family: var(--mono); }
  .modal-head .clock { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--run); font-variant-numeric: tabular-nums; }
  .modal-head button { padding: 4px 10px; }
  .timeline { padding: 12px 18px; max-height: 62vh; overflow-y: auto; }
  .ev { border-left: 2px solid var(--line); padding: 6px 0 6px 14px; margin-left: 4px; }
  .ev .k { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }
  .ev.tool { border-left-color: var(--accent-dim); }
  .ev.llm { border-left-color: var(--line); }
  .ev.error { border-left-color: var(--critical); }
  .ev .callline { font-family: var(--mono); font-size: 12px; margin-top: 2px; }
  .ev .st { padding: 0 6px; border-radius: 4px; font-size: 11px; }
  .ev .st.ok { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
  .ev .st.err { color: var(--critical); background: color-mix(in srgb, var(--critical) 12%, transparent); }
  .ev .args, .ev .resp, .ev .think { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); white-space: pre-wrap; margin-top: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-height: 160px; overflow: auto; }
  .badge-tier { font-family: var(--mono); font-size: 10px; padding: 0 5px; border-radius: 3px; }
  .summary-line { padding: 10px 18px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--ink-dim); display: flex; gap: 18px; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1>Larkspur Agent Factory <span class="dim">/ control panel</span></h1>
  <a href="/bench" style="color:var(--accent);font-size:12px;text-decoration:none;border:1px solid var(--accent-dim);padding:4px 10px;border-radius:6px">Gateway bench →</a>
  <div class="health">
    <span id="h-org"><span class="dot"></span>org</span>
    <span id="h-key"><span class="dot"></span>model key</span>
  </div>
</header>

<div class="wrap">
  <aside class="rail">
    <div class="rail-head">Boilerplate agents</div>
    <div id="agent-list"></div>
  </aside>
  <main id="main">
    <div class="empty">Select an agent on the left to see the exact system prompt and tool list it would be given, then dry-run it for free or launch a real run.</div>
  </main>
</div>

<dialog id="run-modal">
  <div class="modal-head">
    <span class="spin" id="modal-spin"></span>
    <h3 id="modal-title">run</h3>
    <span class="clock" id="modal-clock">0.0s</span>
    <button class="ghost" onclick="stopClock(); document.getElementById('run-modal').close()">Close</button>
  </div>
  <div class="timeline" id="timeline"></div>
  <div class="summary-line" id="modal-summary"></div>
</dialog>

<script>
const TIERS = ["read", "write", "destructive", "critical"];
const $ = (s, r=document) => r.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
let selected = null;

async function j(url, opts) { const r = await fetch(url, opts); return r.json(); }

async function health() {
  const h = await j("/api/health");
  const org = $("#h-org"), key = $("#h-key");
  org.querySelector(".dot").className = "dot " + (h.org_ok ? "ok" : "bad");
  org.lastChild.textContent = h.org_ok ? " org up" : " org down (" + h.org_url + ")";
  key.querySelector(".dot").className = "dot " + (h.has_key ? "ok" : "bad");
  key.lastChild.textContent = h.has_key ? " model key set" : " no model key";
}

async function loadAgents() {
  const agents = await j("/api/agents");
  const list = $("#agent-list");
  list.innerHTML = "";
  for (const a of agents) {
    const card = el("div", "agent-card");
    card.dataset.name = a.name;
    card.append(el("div", "name", a.name));
    if (a.description) card.append(el("div", "desc", a.description));
    const perms = el("div", "perms");
    for (const [m, v] of Object.entries(a.permissions)) {
      if (!v) continue;
      perms.append(el("span", "pchip " + v, m + ":" + v));
    }
    card.append(perms);
    card.onclick = () => selectAgent(a.name);
    list.append(card);
  }
}

async function selectAgent(name) {
  selected = name;
  document.querySelectorAll(".agent-card").forEach(c => c.classList.toggle("sel", c.dataset.name === name));
  const d = await j("/api/agents/" + name);
  const m = $("#main");
  m.innerHTML = "";

  const head = el("div", "detail-head");
  head.append(el("h2", null, d.name));
  const tags = el("div", "tags");
  (d.tags || []).forEach(t => tags.append(el("span", "tag", t)));
  head.append(tags);
  m.append(head);
  if (d.description) m.append(el("p", "subtle", d.description));

  // actions
  const actions = el("div", "actions");
  const launch = el("button", "primary", "Launch run — spends tokens");
  const dry = el("button", "ghost", "Dry run (free)");
  const sel = el("select");
  ["", "claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5"].forEach(mo => {
    const o = el("option", null, mo || ("spec model: " + d.model)); o.value = mo; sel.append(o);
  });
  launch.onclick = () => doLaunch(name, sel.value);
  dry.onclick = () => selectAgent(name);
  actions.append(launch, sel, dry);
  actions.append(el("span", "warn", "Launch runs " + d.model + " against the live org and executes its tool calls for real."));
  m.append(actions);

  const grid = el("div", "grid");

  // permissions
  const pb = block("Permissions", "tight");
  const pbody = el("div");
  for (const [mod, v] of Object.entries(d.permissions)) {
    const row = el("div", "permrow");
    row.append(el("span", "mod", mod));
    row.append(el("span", "permval " + (v || "none"), v || "hidden"));
    pbody.append(row);
  }
  pb.querySelector(".body").append(pbody);
  grid.append(pb);

  // query
  const qb = block("Task (query)");
  qb.querySelector(".body").append(el("pre", "query", d.query));
  grid.append(qb);

  m.append(grid);

  // tools
  const tb = block("Tools it can call", "tight", d.tool_count + " endpoints");
  const tbody = el("div");
  for (const tier of TIERS) {
    const tools = (d.tools_by_tier[tier] || []);
    if (!tools.length) continue;
    const g = el("div", "tiergroup");
    const h = el("div", "tierhead t-" + tier);
    h.append(el("span", "stripe"));
    h.append(el("span", null, tier));
    h.append(el("span", "count", tools.length));
    g.append(h);
    for (const t of tools) {
      const row = el("div", "tool");
      row.append(el("span", "m", t.method));
      row.append(el("span", "n", t.name));
      row.append(el("span", "p", t.path));
      g.append(row);
    }
    tbody.append(g);
  }
  tb.querySelector(".body").append(tbody);
  m.append(tb);

  // system prompt
  const sb = block("System prompt given to the model");
  sb.querySelector(".body").append(el("pre", "prompt", d.system));
  m.append(sb);

  // recent runs for this agent
  const rb = block("Runs", "tight");
  rb.querySelector(".body").id = "runs-body";
  m.append(rb);
  refreshRuns(name);
}

function block(title, tight, right) {
  const b = el("div", "block");
  const h = el("h3", null);
  h.append(el("span", null, title));
  if (right) h.append(el("span", null, right));
  b.append(h);
  b.append(el("div", "body" + (tight ? " tight" : "")));
  return b;
}

async function refreshRuns(agentFilter) {
  const rows = await j("/api/runs");
  const body = $("#runs-body");
  if (!body) return;
  body.innerHTML = "";
  const mine = rows.filter(r => !agentFilter || r.agent === agentFilter);
  if (!mine.length) { body.append(el("div", "tool", "no runs yet")); return; }
  for (const r of mine.slice(0, 12)) {
    const row = el("div", "runrow");
    const dot = el("span"); dot.className = r.status === "running" ? "spin" : "";
    if (r.status !== "running") { dot.className = "dot " + (r.status === "error" ? "bad" : "ok"); }
    row.append(dot);
    row.append(el("span", "rid", r.run_id));
    row.append(el("span", "meta", r.model || ""));
    row.append(el("span", "meta", r.tool_calls != null ? r.tool_calls + " calls" : ""));
    row.append(el("span", "dur", fmtSecs(r.seconds)));
    row.append(el("span", "status " + r.status, r.status + (r.cost_usd != null ? "  $" + r.cost_usd : "")));
    row.onclick = () => openRun(r.run_id);
    body.append(row);
  }
}

async function doLaunch(name, model) {
  const res = await j("/api/agents/" + name + "/launch", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(model ? {model} : {}),
  });
  openRun(res.run_id);
  refreshRuns(name);
}

let pollTimer = null, clockTimer = null, clockBase = 0, clockAt = 0;
function startClock(seconds) {
  stopClock();
  clockBase = seconds || 0; clockAt = performance.now();
  $("#modal-clock").textContent = fmtSecs(clockBase);
  clockTimer = setInterval(() => {
    const live = clockBase + (performance.now() - clockAt) / 1000;
    $("#modal-clock").textContent = live.toFixed(1) + "s";
  }, 100);
}
function stopClock(finalSeconds) {
  if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
  if (finalSeconds != null) $("#modal-clock").textContent = fmtSecs(finalSeconds);
}
function fmtSecs(x) { return x == null ? "—" : (x < 60 ? x.toFixed(1) + "s" : Math.floor(x/60) + "m " + Math.round(x%60) + "s"); }

async function openRun(runId) {
  const modal = $("#run-modal");
  $("#modal-title").textContent = runId;
  $("#timeline").innerHTML = "";
  $("#modal-summary").textContent = "";
  modal.showModal();
  if (pollTimer) clearInterval(pollTimer);
  const tick = async () => {
    const d = await j("/api/runs/" + runId);
    renderTimeline(d);
    const running = d.status === "running";
    $("#modal-spin").style.visibility = running ? "visible" : "hidden";
    if (running) { if (!clockTimer) startClock(d.elapsed); }
    else { stopClock(d.elapsed); clearInterval(pollTimer); pollTimer = null; if (selected) refreshRuns(selected); }
  };
  await tick();
  pollTimer = setInterval(tick, 1200);
}

function renderTimeline(d) {
  const tl = $("#timeline");
  tl.innerHTML = "";
  for (const ev of d.events) {
    if (ev.kind === "run_start") continue;
    const e = el("div", "ev " + ev.kind);
    e.append(el("span", "k", ev.kind + "  ·  +" + ev.t + "s"));
    if (ev.kind === "llm") {
      if (ev.text) e.append(el("div", "think", ev.text));
      (ev.tool_uses || []).forEach(tu => {
        e.append(el("div", "callline", "→ wants " + tu.name + " " + JSON.stringify(tu.input)));
      });
      if (!ev.text && !(ev.tool_uses||[]).length) e.append(el("div", "callline", "(" + ev.stop_reason + ")"));
    } else if (ev.kind === "tool") {
      const line = el("div", "callline");
      const tier = ev.tier || "—";
      const tb = el("span", "badge-tier t-" + (ev.tier||""), tier);
      tb.style.color = tierColor(ev.tier); tb.style.background = tierColor(ev.tier, .13);
      line.append(tb);
      line.append(document.createTextNode(" " + ev.method + " " + ev.path + "  "));
      const st = el("span", "st " + (ev.status >= 400 ? "err" : "ok"), String(ev.status));
      line.append(st);
      e.append(line);
      if (ev.args && Object.keys(ev.args).length) e.append(el("div", "args", JSON.stringify(ev.args)));
      if (ev.response != null) e.append(el("div", "resp", typeof ev.response === "string" ? ev.response : JSON.stringify(ev.response).slice(0, 1200)));
    } else if (ev.kind === "error") {
      e.append(el("div", "resp", ev.error));
    }
    tl.append(e);
  }
  tl.scrollTop = tl.scrollHeight;
  if (d.summary) {
    const s = d.summary;
    $("#modal-summary").innerHTML = "";
    const bits = [["steps", s.steps], ["tool calls", (s.tool_calls||[]).length], ["stop", s.stop], ["tokens", s.usage.input_tokens + "→" + s.usage.output_tokens], ["cost", "$" + s.cost_usd], ["time", s.seconds + "s"]];
    bits.forEach(([k,v]) => { const sp = el("span"); sp.append(el("span", null, k+": ")); sp.append(document.createTextNode(v)); $("#modal-summary").append(sp); });
  } else if (d.error) {
    $("#modal-summary").textContent = d.error;
  }
}

function tierColor(t, alpha) {
  const map = {read:"63,182,168", write:"216,161,58", destructive:"224,122,62", critical:"224,85,107"};
  const rgb = map[t] || "102,114,127";
  return alpha ? `rgba(${rgb},${alpha})` : `rgb(${rgb})`;
}

health(); loadAgents(); setInterval(health, 5000);
</script>
</body>
</html>
